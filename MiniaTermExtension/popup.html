<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
        width: 260px;
        padding: 14px;
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        background-color: #f8fafc;
        color: #0f172a;
      }
      h3 {
        margin: 0 0 10px 0;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 10px;
        font-size: 13px;
        line-height: 1.4;
      }
      .item {
        margin-bottom: 8px;
      }
      .item:last-child {
        margin-bottom: 0;
      }
      .found {
        color: #16a34a;
        font-weight: 600;
      }
      .not-found {
        color: #94a3b8;
      }
      a {
        color: #2563eb;
        text-decoration: none;
        word-break: break-all;
        font-size: 11px;
        display: block;
        margin-top: 2px;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h3>🔍 Scanner</h3>
    <div id="results" class="card">
      Scanning page...
    </div>

    <script src="popup.js"></script>
  </body>
</html>
